services:
  # ------------------------------------------------------------------
  # API Gateway Reverse Proxy Service (Nginx) - Single Entrypoint
  # ------------------------------------------------------------------
  gateway:
    image: nginx:alpine
    container_name: api_gateway
    restart: always
    depends_on:
      - monsters
      - pokeapi
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - app-network

  # ------------------------------------------------------------------
  # PostgreSQL Database Service
  # ------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: resident_evil_postgres
    restart: always
    environment:
      POSTGRES_DB: resident_evil_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: leon405049
    volumes:
      # Data persistence across container restarts
      - postgres_data:/var/lib/postgresql/data
      # Automatically execute initial database schema and seed script
      - ./apps/monsters/src/main/resources/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - app-network

  # ------------------------------------------------------------------
  # Spring Boot Backend Service (Monsters) - Internal Upstream
  # ------------------------------------------------------------------
  monsters:
    build:
      context: ./apps/monsters
      dockerfile: Dockerfile
    container_name: monsters_app
    restart: always
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/resident_evil_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: leon405049
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    expose:
      - "8080"
    networks:
      - app-network

  # ------------------------------------------------------------------
  # Nginx Static Frontend Service (PokeAPI) - Internal Upstream
  # ------------------------------------------------------------------
  pokeapi:
    build:
      context: ./apps/pokeapi
      dockerfile: Dockerfile
    container_name: pokedex_app
    restart: always
    expose:
      - "80"
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
