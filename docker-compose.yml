services:
  # ------------------------------------------------------------------
  # Base de datos PostgreSQL
  # ------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: resident_evil_postgres
    restart: always
    environment:
      POSTGRES_DB: resident_evil_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: leon405049
    volumes:
      # Persistencia de los datos para que no se borren si el contenedor se reinicia
      - postgres_data:/var/lib/postgresql/data
      # Ejecuta automáticamente el script de creación y registros iniciales
      - ./monsters/src/main/resources/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - app-network

  # ------------------------------------------------------------------
  # Backend Spring Boot (Monsters)
  # ------------------------------------------------------------------
  monsters:
    build:
      context: ./monsters
      dockerfile: Dockerfile
    container_name: monsters_app
    restart: always
    depends_on:
      - db
    environment:
      # Conecta directamente al servicio 'db' en lugar de localhost
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/resident_evil_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: leon405049
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
    networks:
      - app-network

  # ------------------------------------------------------------------
  # Frontend PokeAPI (Nginx)
  # ------------------------------------------------------------------
  pokeapi:
    build:
      context: ./pokeapi
      dockerfile: Dockerfile
    container_name: pokedex_app
    restart: always
    ports:
      - "80:80"
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
