# ==============================================================================
# API Gateway Security Hardening & Rate Limiting Policies (PROG-7)
# ==============================================================================

# Disable server version tokens in response headers and default error pages
server_tokens off;

# Rate Limiting Zone: 10 requests/second per binary client IP with 10MB memory storage
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_status 429;

# ------------------------------------------------------------------------------
# Strict Security Headers
# ------------------------------------------------------------------------------

# Content-Security-Policy (CSP): Restrict script, stylesheet, font, and network origins
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://raw.githubusercontent.com; connect-src 'self' https://pokeapi.co; media-src 'self' https://raw.githubusercontent.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" always;

# Prevent Clickjacking by forbidding iframe rendering
add_header X-Frame-Options "DENY" always;

# Prevent MIME-type sniffing
add_header X-Content-Type-Options "nosniff" always;

# Control referrer leakage across origins
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Restrict sensitive browser permissions and APIs
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Enable legacy XSS filter in blocking mode
add_header X-XSS-Protection "1; mode=block" always;
