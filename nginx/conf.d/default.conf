# ==============================================================================
# API Gateway Upstream Routing & Route Masking (PROG-7)
# ==============================================================================

upstream monsters_backend {
    server monsters:8080;
    keepalive 32;
}

upstream pokeapi_frontend {
    server pokeapi:80;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    # Strip technology fingerprinting headers from proxied upstreams
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    # --------------------------------------------------------------------------
    # Route Masking: Public API Route -> Monsters Backend
    # External path: /api/monsters -> Internal service: http://monsters_backend/monsters
    # Rate limited to 10 req/s with burst=20 and instant nodelay handling
    # --------------------------------------------------------------------------
    location /api/monsters {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://monsters_backend/monsters;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # Custom Error Handler for HTTP 429 Too Many Requests
    # --------------------------------------------------------------------------
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"error": "Too Many Requests", "status": 429, "message": "Rate limit exceeded (10 req/s). Burst threshold reached. Please retry shortly."}';
    }

    # --------------------------------------------------------------------------
    # Route Masking: Public Web Route -> Pokédex Application
    # External path: / -> Internal service: http://pokeapi_frontend/
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://pokeapi_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
